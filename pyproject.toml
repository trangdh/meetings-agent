[project]
name = "meetings-agent"
version = "0.1.0"
description = "Agent that records, transcribes, and summarizes meetings (Slack huddles), and syncs knowledge updates to a shared file"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.92.0",
    "faster-whisper>=1.0.0",
    "groq>=1.5.0",
    "soundcard>=0.4.3",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.scripts]
meetings-agent = "meetings_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
